<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON ROAD RUSH - 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Arial Black", sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .ui-panel {
      position: absolute;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #0ff;
      padding: 10px 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    #speedometer {
      top: 20px;
      right: 20px;
      min-width: 200px;
    }

    #distanceometer {
      top: 20px;
      left: 20px;
    }

    #menu {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0f0a1f);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 30px;
    }

    #menu.hidden {
      display: none;
    }

    #menu h1 {
      font-size: 4rem;
      text-shadow: 0 0 30px #0ff, 0 0 60px #0f0;
      letter-spacing: 4px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 30px #0ff, 0 0 60px #0f0; }
      50% { text-shadow: 0 0 50px #0ff, 0 0 80px #0f0, 0 0 100px #f0f; }
    }

    .menu-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .menu-btn {
      padding: 15px 40px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #0ff, #0f0);
      border: none;
      color: #000;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      transition: all 0.2s;
    }

    .menu-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 1), 0 0 60px rgba(0, 255, 0, 1);
    }

    .settings-panel {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #0ff;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      gap: 20px;
    }

    .setting-row label {
      color: #0ff;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .setting-row input[type="range"] {
      width: 150px;
      cursor: pointer;
    }

    .setting-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .setting-value {
      color: #0f0;
      font-weight: bold;
      min-width: 60px;
    }

    #gameOver {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      gap: 20px;
    }

    #gameOver.hidden {
      display: none;
    }

    #gameOver h2 {
      font-size: 3rem;
      color: #f0f;
      text-shadow: 0 0 30px #f0f;
      letter-spacing: 3px;
    }

    #finalScore {
      font-size: 2.5rem;
      color: #0f0;
      text-shadow: 0 0 20px #0f0;
    }

    .hud-info {
      position: absolute;
      color: #0ff;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #turbo-indicator {
      bottom: 20px;
      left: 20px;
      color: #f00;
      text-shadow: 0 0 10px #f00;
    }

    .turbo-bar {
      width: 200px;
      height: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #f00;
      margin-top: 5px;
      position: relative;
    }

    .turbo-fill {
      height: 100%;
      background: linear-gradient(90deg, #f00, #ff0);
      width: 0%;
      box-shadow: 0 0 10px #f00;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="menu">
      <h1>⚡ NEON ROAD RUSH ⚡</h1>
      <div class="subtitle" style="color: #0f0; font-size: 20px; letter-spacing: 2px; text-transform: uppercase;">
        PS2 STYLE • 3D RACING • PURE CHAOS
      </div>

      <div class="menu-buttons">
        <button class="menu-btn" id="startBtn">START GAME</button>
        <button class="menu-btn" id="settingsBtn" style="background: linear-gradient(135deg, #f0f, #f00);">SETTINGS</button>
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <div class="setting-row">
          <label>Speed</label>
          <input id="speedMult" type="range" min="0.8" max="2.5" step="0.1" value="1" />
          <span class="setting-value" id="speedVal">1.0x</span>
        </div>

        <div class="setting-row">
          <label>Traffic</label>
          <input id="trafficMult" type="range" min="0.5" max="2.5" step="0.1" value="1" />
          <span class="setting-value" id="trafficVal">1.0x</span>
        </div>

        <div class="setting-row">
          <label>Turbo Mode</label>
          <input id="turboMode" type="checkbox" />
        </div>

        <div class="setting-row">
          <label>Night Mode</label>
          <input id="nightMode" type="checkbox" />
        </div>

        <div class="setting-row">
          <label>No Collide</label>
          <input id="noCollide" type="checkbox" />
        </div>
      </div>
    </div>

    <div id="gameOver" class="hidden">
      <h2>GAME OVER</h2>
      <div id="finalScore">0 METERS</div>
      <div class="menu-buttons">
        <button class="menu-btn" id="retryBtn">TRY AGAIN</button>
        <button class="menu-btn" id="menuBtn">MAIN MENU</button>
      </div>
    </div>

    <div id="speedometer" class="ui-panel">
      <div>Speed: <span id="speedDisplay">0</span> km/h</div>
      <div style="margin-top: 10px; font-size: 12px;">RPM: <span id="rpmDisplay">0</span></div>
    </div>

    <div id="distanceometer" class="ui-panel">
      <div>Distance: <span id="distDisplay">0</span> m</div>
      <div style="margin-top: 10px;">Best: <span id="bestDisplay">0</span> m</div>
    </div>

    <div id="turbo-indicator">
      TURBO
      <div class="turbo-bar">
        <div class="turbo-fill" id="turboFill"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // ==================== GAME STATE ====================
    const gameState = {
      mode: 'menu', // menu, playing, gameover
      distance: 0,
      speed: 0,
      targetSpeed: 0,
      turbo: 0,
      maxTurbo: 100,
      roadPosition: 0,
      playerLane: 1, // 0, 1, 2
      targetLane: 1,
      crashed: false,
      best: localStorage.getItem('neonRushBest') || 0
    };

    const config = {
      speedMult: 1,
      trafficMult: 1,
      turboMode: false,
      nightMode: false,
      noCollide: false
    };

    const input = {
      left: false,
      right: false,
      up: false,
      down: false,
      space: false
    };

    // ==================== 3D ROAD SYSTEM ====================
    const roadSegments = [];
    const roadConfig = {
      segmentLength: 100,
      roadWidth: 300,
      lanes: 3,
      laneWidth: 100
    };

    const obstacles = [];

    function generateRoadSegments() {
      roadSegments.length = 0;
      for (let i = 0; i < 150; i++) {
        roadSegments.push({
          z: i * roadConfig.segmentLength,
          wobble: Math.sin(i * 0.15) * 40,
          width: roadConfig.roadWidth,
          curve: Math.sin(i * 0.08) * 0.3
        });
      }
    }

    function screenToRoad(x, z) {
      const depth = z / (canvas.height - 100);
      const horizonY = 100;
      const centerX = canvas.width / 2;
      const screenY = horizonY + depth * (canvas.height - horizonY);
      const roadScreenWidth = (1 - depth) * canvas.width * 0.8;

      return {
        x: ((x - centerX) / roadScreenWidth) * roadConfig.roadWidth,
        screenY: screenY
      };
    }

    function roadToScreen(x, z) {
      const depth = z / (canvas.height - 100);
      if (depth <= 0 || depth >= 1) return null;

      const horizonY = 100;
      const centerX = canvas.width / 2;
      const roadScreenWidth = (1 - depth) * canvas.width * 0.8;
      const screenY = horizonY + depth * (canvas.height - horizonY);
      const screenX = centerX + (x / roadConfig.roadWidth) * roadScreenWidth;

      return {
        x: screenX,
        y: screenY,
        width: roadScreenWidth
      };
    }

    // ==================== RENDERING ====================
    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      
      if (config.nightMode) {
        gradient.addColorStop(0, '#0a0a2e');
        gradient.addColorStop(0.5, '#16213e');
        gradient.addColorStop(1, '#0f3460');
      } else {
        gradient.addColorStop(0, '#87ceeb');
        gradient.addColorStop(0.5, '#d4a574');
        gradient.addColorStop(1, '#8b6f47');
      }
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun/Moon
      const sunX = canvas.width * 0.75;
      const sunY = canvas.height * 0.2;
      ctx.fillStyle = config.nightMode ? '#e0e0e0' : '#ffcc00';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
      ctx.fill();

      // Stars
      if (config.nightMode) {
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 100; i++) {
          const x = (i * 73.5) % canvas.width;
          const y = ((i * 97.3) % 80) + 10;
          ctx.fillRect(x, y, 1, 1);
        }
      }

      // Horizon line
      ctx.strokeStyle = config.nightMode ? '#333' : '#999';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 100);
      ctx.lineTo(canvas.width, 100);
      ctx.stroke();
    }

    function drawRoad3D() {
      const cameraZ = gameState.roadPosition;
      const cameraX = gameState.playerLane * roadConfig.laneWidth - roadConfig.roadWidth / 2;

      for (let i = 0; i < roadSegments.length; i++) {
        const seg = roadSegments[i];
        const nextSeg = roadSegments[i + 1] || seg;
        
        const relZ = seg.z - cameraZ;
        const nextRelZ = nextSeg.z - cameraZ;

        if (relZ > canvas.height || nextRelZ < 0) continue;

        const road1 = roadToScreen(seg.wobble, relZ);
        const road2 = roadToScreen(nextSeg.wobble, nextRelZ);

        if (!road1 || !road2) continue;

        // Road surface
        ctx.fillStyle = (Math.floor(i / 2) % 2) === 0 ? '#2a2a2a' : '#333';
        ctx.beginPath();
        ctx.moveTo(road1.x - road1.width / 2, road1.y);
        ctx.lineTo(road1.x + road1.width / 2, road1.y);
        ctx.lineTo(road2.x + road2.width / 2, road2.y);
        ctx.lineTo(road2.x - road2.width / 2, road2.y);
        ctx.closePath();
        ctx.fill();

        // Grass/shoulders
        ctx.fillStyle = config.nightMode ? '#1a3a1a' : '#2d5a2d';
        ctx.beginPath();
        ctx.moveTo(0, road1.y);
        ctx.lineTo(road1.x - road1.width / 2, road1.y);
        ctx.lineTo(road2.x - road2.width / 2, road2.y);
        ctx.lineTo(0, road2.y);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(canvas.width, road1.y);
        ctx.lineTo(road1.x + road1.width / 2, road1.y);
        ctx.lineTo(road2.x + road2.width / 2, road2.y);
        ctx.lineTo(canvas.width, road2.y);
        ctx.closePath();
        ctx.fill();

        // Lane lines
        if (i % 2 === 0) {
          ctx.strokeStyle = config.nightMode ? '#444' : '#ffff00';
          ctx.lineWidth = 2;

          for (let lane = 1; lane < roadConfig.lanes; lane++) {
            const laneX1 = road1.x - road1.width / 2 + (lane / roadConfig.lanes) * road1.width;
            const laneX2 = road2.x - road2.width / 2 + (lane / roadConfig.lanes) * road2.width;

            ctx.setLineDash(i % 4 === 0 ? [8, 8] : []);
            ctx.beginPath();
            ctx.moveTo(laneX1, road1.y);
            ctx.lineTo(laneX2, road2.y);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        // Edge lines
        ctx.strokeStyle = config.nightMode ? '#666' : '#ffff00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(road1.x - road1.width / 2, road1.y);
        ctx.lineTo(road2.x - road2.width / 2, road2.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(road1.x + road1.width / 2, road1.y);
        ctx.lineTo(road2.x + road2.width / 2, road2.y);
        ctx.stroke();
      }

      // Trees
      drawTrees3D();
    }

    function drawTrees3D() {
      const cameraZ = gameState.roadPosition;
      
      for (let i = 0; i < 30; i++) {
        const treeZ = i * 300;
        const relZ = treeZ - cameraZ;

        if (relZ > canvas.height || relZ < 0) continue;

        const leftPos = roadToScreen(-roadConfig.roadWidth * 0.8, relZ);
        const rightPos = roadToScreen(roadConfig.roadWidth * 0.8, relZ);

        if (!leftPos || !rightPos) continue;

        const scale = leftPos.width / canvas.width * 0.5;
        
        // Left trees
        drawTree(leftPos.x - 30, leftPos.y, scale);
        drawTree(leftPos.x - 80, leftPos.y, scale * 0.7);

        // Right trees
        drawTree(rightPos.x + 30, rightPos.y, scale);
        drawTree(rightPos.x + 80, rightPos.y, scale * 0.7);
      }
    }

    function drawTree(x, y, scale) {
      const w = 30 * scale;
      const h = 60 * scale;

      // Trunk
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(x - w * 0.15, y, w * 0.3, h * 0.4);

      // Foliage
      ctx.fillStyle = config.nightMode ? '#1a4a1a' : '#228b22';
      ctx.beginPath();
      ctx.arc(x, y - h * 0.2, w * 0.6, 0, Math.PI * 2);
      ctx.arc(x - w * 0.4, y, w * 0.5, 0, Math.PI * 2);
      ctx.arc(x + w * 0.4, y, w * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCar3D(x, z, color, isPlayer = false) {
      const roadPos = roadToScreen(x, z - gameState.roadPosition);
      if (!roadPos) return;

      const depth = (z - gameState.roadPosition) / canvas.height;
      const scale = Math.max(0.3, 1 - depth * 0.5);
      
      const w = 50 * scale;
      const h = 80 * scale;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(roadPos.x - w / 2, roadPos.y + h * 0.8, w, h * 0.15);

      // Car body
      const gradient = ctx.createLinearGradient(roadPos.x - w / 2, roadPos.y, roadPos.x + w / 2, roadPos.y);
      gradient.addColorStop(0, lighten(color, 30));
      gradient.addColorStop(0.5, color);
      gradient.addColorStop(1, darken(color, 30));

      ctx.fillStyle = gradient;
      roundRect(roadPos.x - w / 2, roadPos.y, w, h, 8);
      ctx.fill();

      // Windshield
      ctx.fillStyle = 'rgba(100, 150, 255, 0.6)';
      roundRect(roadPos.x - w * 0.35, roadPos.y + h * 0.15, w * 0.7, h * 0.25, 5);
      ctx.fill();

      // Windows
      ctx.fillStyle = 'rgba(50, 100, 200, 0.8)';
      ctx.fillRect(roadPos.x - w * 0.25, roadPos.y + h * 0.4, w * 0.2, h * 0.2);
      ctx.fillRect(roadPos.x + w * 0.05, roadPos.y + h * 0.4, w * 0.2, h * 0.2);

      // Headlights
      ctx.fillStyle = '#ffff00';
      ctx.fillRect(roadPos.x - w * 0.3, roadPos.y + h * 0.7, w * 0.2, h * 0.1);
      ctx.fillRect(roadPos.x + w * 0.1, roadPos.y + h * 0.7, w * 0.2, h * 0.1);

      if (isPlayer) {
        // Player glow
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.6;
        roundRect(roadPos.x - w / 2 - 5, roadPos.y - 5, w + 10, h + 10, 10);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function lighten(color, amount) {
      const c = parseInt(color.replace('#', ''), 16);
      const r = Math.min(255, ((c >> 16) & 255) + amount);
      const g = Math.min(255, ((c >> 8) & 255) + amount);
      const b = Math.min(255, (c & 255) + amount);
      return `rgb(${r},${g},${b})`;
    }

    function darken(color, amount) {
      const c = parseInt(color.replace('#', ''), 16);
      const r = Math.max(0, ((c >> 16) & 255) - amount);
      const g = Math.max(0, ((c >> 8) & 255) - amount);
      const b = Math.max(0, (c & 255) - amount);
      return `rgb(${r},${g},${b})`;
    }

    // ==================== GAME LOGIC ====================
    function spawnObstacle() {
      obstacles.push({
        lane: Math.floor(Math.random() * 3),
        z: gameState.roadPosition + canvas.height + 100,
        speed: gameState.speed * (0.6 + Math.random() * 0.3),
        color: ['#ff6b6b', '#ff9ff3', '#54a0ff', '#48dbfb', '#1dd1a1', '#ffa502'][Math.floor(Math.random() * 6)]
      });
    }

    function updateGame(deltaTime) {
      const dt = deltaTime / 1000;

      // Speed calculation
      const baseSpeed = 150 + config.speedMult * 100;
      
      if (input.up) {
        gameState.targetSpeed = baseSpeed + 200;
        if (config.turboMode && gameState.turbo > 0) {
          gameState.targetSpeed += 150;
          gameState.turbo = Math.max(0, gameState.turbo - deltaTime * 0.05);
        }
      } else if (input.down) {
        gameState.targetSpeed = Math.max(50, baseSpeed - 100);
      } else {
        gameState.targetSpeed = baseSpeed;
      }

      gameState.speed += (gameState.targetSpeed - gameState.speed) * 0.1;
      gameState.roadPosition += gameState.speed * dt;

      // Generate turbo
      if (!input.up && gameState.turbo < gameState.maxTurbo) {
        gameState.turbo += deltaTime * 0.02;
      }

      // Lane change
      if (input.left) {
        gameState.targetLane = Math.max(0, gameState.targetLane - 1);
        input.left = false;
      }
      if (input.right) {
        gameState.targetLane = Math.min(2, gameState.targetLane + 1);
        input.right = false;
      }

      gameState.playerLane += (gameState.targetLane - gameState.playerLane) * 0.15;

      // Obstacle spawning
      if (Math.random() < 0.02 * config.trafficMult) {
        spawnObstacle();
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z += obs.speed * dt;

        if (obs.z > gameState.roadPosition + canvas.height + 200) {
          obstacles.splice(i, 1);
          gameState.distance += 10;
          continue;
        }

        // Collision
        if (!config.noCollide) {
          const relZ = obs.z - gameState.roadPosition;
          if (relZ > -100 && relZ < 150) {
            const obsPosX = obs.lane * roadConfig.laneWidth - roadConfig.roadWidth / 2 + roadConfig.laneWidth / 2;
            const playerPosX = gameState.playerLane * roadConfig.laneWidth - roadConfig.roadWidth / 2 + roadConfig.laneWidth / 2;
            
            if (Math.abs(obsPosX - playerPosX) < 30) {
              gameState.crashed = true;
            }
          }
        }
      }

      // Update UI
      document.getElementById('distDisplay').textContent = Math.floor(gameState.distance);
      document.getElementById('speedDisplay').textContent = Math.floor(gameState.speed * 1.5);
      document.getElementById('rpmDisplay').textContent = Math.floor((gameState.speed / 600) * 10000);
      document.getElementById('turboFill').style.width = (gameState.turbo / gameState.maxTurbo * 100) + '%';
    }

    function drawGame() {
      drawBackground();
      drawRoad3D();

      // Draw obstacles
      for (const obs of obstacles) {
        drawCar3D(obs.lane * roadConfig.laneWidth - roadConfig.roadWidth / 2 + roadConfig.laneWidth / 2, obs.z, obs.color, false);
      }

      // Draw player car
      const playerX = gameState.playerLane * roadConfig.laneWidth - roadConfig.roadWidth / 2 + roadConfig.laneWidth / 2;
      drawCar3D(playerX, gameState.roadPosition + 200, '#0f0', true);

      // Speed lines
      if (gameState.speed > 300) {
        ctx.strokeStyle = `rgba(0, 255, 255, ${(gameState.speed - 300) / 300 * 0.5})`;
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) {
          const y = (gameState.roadPosition * 2 + i * 100) % canvas.height;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      // Crash flash
      if (gameState.crashed) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    // ==================== INPUT ====================
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') input.up = true;
      if (key === 's' || key === 'arrowdown') input.down = true;
      if (key === 'a' || key === 'arrowleft') input.left = true;
      if (key === 'd' || key === 'arrowright') input.right = true;
      if (key === ' ') input.space = true;

      if (key === 'enter' && gameState.mode !== 'playing') {
        startGame();
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') input.up = false;
      if (key === 's' || key === 'arrowdown') input.down = false;
      if (key === 'a' || key === 'arrowleft') input.left = false;
      if (key === 'd' || key === 'arrowright') input.right = false;
      if (key === ' ') input.space = false;
    });

    // ==================== UI HANDLERS ====================
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('menuBtn').addEventListener('click', () => {
      gameState.mode = 'menu';
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('gameOver').classList.add('hidden');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsPanel').style.display = 
        document.getElementById('settingsPanel').style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('speedMult').addEventListener('input', (e) => {
      config.speedMult = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = config.speedMult.toFixed(1) + 'x';
    });

    document.getElementById('trafficMult').addEventListener('input', (e) => {
      config.trafficMult = parseFloat(e.target.value);
      document.getElementById('trafficVal').textContent = config.trafficMult.toFixed(1) + 'x';
    });

    document.getElementById('turboMode').addEventListener('change', (e) => {
      config.turboMode = e.target.checked;
    });

    document.getElementById('nightMode').addEventListener('change', (e) => {
      config.nightMode = e.target.checked;
    });

    document.getElementById('noCollide').addEventListener('change', (e) => {
      config.noCollide = e.target.checked;
    });

    function startGame() {
      gameState.mode = 'playing';
      gameState.distance = 0;
      gameState.speed = 0;
      gameState.targetSpeed = 0;
      gameState.turbo = gameState.maxTurbo * 0.5;
      gameState.roadPosition = 0;
      gameState.playerLane = 1;
      gameState.targetLane = 1;
      gameState.crashed = false;
      obstacles.length = 0;

      document.getElementById('menu').classList.add('hidden');
      document.getElementById('gameOver').classList.add('hidden');
      
      generateRoadSegments();
    }

    function endGame() {
      gameState.mode = 'gameover';
      document.getElementById('finalScore').textContent = Math.floor(gameState.distance) + ' METERS';
      
      if (gameState.distance > gameState.best) {
        gameState.best = gameState.distance;
        localStorage.setItem('neonRushBest', gameState.best);
      }
      
      document.getElementById('bestDisplay').textContent = Math.floor(gameState.best) + ' m';
      document.getElementById('gameOver').classList.remove('hidden');
    }

    // ==================== MAIN LOOP ====================
    generateRoadSegments();
    let lastTime = performance.now();

    function gameLoop(now) {
      const deltaTime = now - lastTime;
      lastTime = now;

      if (gameState.mode === 'playing') {
        updateGame(deltaTime);
        
        if (gameState.crashed) {
          setTimeout(() => {
            endGame();
          }, 500);
          gameState.mode = 'ending';
        }
      }

      drawGame();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
