<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Road Rush</title>
  <style>
    :root{
      --bg1: #0d1225;
      --bg2: #1b243d;
      --panel: rgba(12, 12, 20, 0.78);
      --panel-border: rgba(118, 202, 255, 0.8);
      --accent: #66f0ff;
      --accent2: #a7ff70;
      --danger: #ff5469;
      --warning: #ffd166;
      --text: #ecf7ff;
      --muted: #b7cfe5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, #10182d 0%, #090d19 28%, #04070d 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #gameShell {
      position: relative;
      width: min(96vw, 1100px);
      height: min(92vh, 720px);
      border: 3px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 2px rgba(94, 180, 255, 0.22),
        0 25px 80px rgba(0,0,0,.7);
      background: #080d16;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a1220;
      image-rendering: auto;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(4, 7, 14, 0.36);
      backdrop-filter: blur(2px);
      z-index: 10;
      transition: opacity .2s ease;
    }

    .panel.hidden { display: none; }

    .menu-box {
      width: min(82%, 560px);
      padding: 26px 22px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(20, 26, 42, 0.82), rgba(15, 16, 28, 0.88));
      border: 2px solid rgba(112, 199, 255, 0.5);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.2),
        0 18px 40px rgba(0,0,0,.35),
        inset 0 0 20px rgba(127,219,255,0.15);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.1rem, 4vw, 4rem);
      text-align: center;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 10px rgba(115, 255, 247, 0.9),
        0 0 25px rgba(101, 194, 255, 0.65);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 0 0 22px;
      font-size: .78rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 12px 22px;
      border-radius: 12px;
      color: #07111c;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #bdfdff 0%, #79edff 23%, #58d0ff 100%);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.15),
        0 8px 24px rgba(102, 233, 255, 0.5);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.18),
        0 10px 26px rgba(102, 233, 255, 0.65);
    }

    button.secondary {
      background: linear-gradient(180deg, #d8ffb0 0%, #9fe465 22%, #6bc96a 100%);
    }

    button.alert {
      background: linear-gradient(180deg, #ffd5d9 0%, #ff9eb1 20%, #ff667d 100%);
    }

    .settings {
      margin-top: 18px;
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 16px;
      display: grid;
      gap: 12px;
      color: var(--text);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 220px;
      accent-color: #7be6ff;
    }

    .check {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .game-over-box {
      width: min(72%, 420px);
      background: rgba(11, 13, 21, 0.92);
      border: 2px solid rgba(255, 120, 141, 0.6);
      border-radius: 18px;
      padding: 18px 22px 20px;
      box-shadow: 0 18px 55px rgba(0,0,0,.4);
      text-align: center;
    }

    .game-over-box h2 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #ffd5dc;
      text-shadow: 0 0 14px rgba(255, 100, 120, 0.7);
    }

    .score-big {
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 900;
      color: #fff7d6;
      margin: 12px 0 20px;
      letter-spacing: .08em;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .hud-panel {
      position: absolute;
      left: 18px;
      top: 18px;
      padding: 10px 14px;
      background: rgba(8, 12, 20, 0.72);
      border: 1px solid rgba(118, 164, 255, 0.48);
      border-radius: 10px;
      box-shadow: inset 0 0 18px rgba(127,219,255,0.12);
    }

    .hud-panel .label {
      font-size: 0.68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .hud-panel .value {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      font-weight: 900;
      color: #f4fbff;
      text-shadow: 0 0 10px rgba(115,255,247, .8);
    }

    .speed-box {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 150px;
      padding: 10px 12px;
      background: rgba(8, 12, 20, 0.72);
      border: 1px solid rgba(118, 164, 255, 0.48);
      border-radius: 10px;
      box-shadow: inset 0 0 18px rgba(127,219,255,0.12);
    }

    .speed-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      margin-top: 6px;
    }

    .speed-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7cff9a, #ffe166, #ff8f6b);
      box-shadow: 0 0 12px rgba(255, 198, 94, 0.8);
      transition: width .08s linear;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 620px) {
      #gameShell { width: 98vw; height: 88vh; }
      .buttons { flex-direction: column; }
      .setting-row, .check { flex-direction: column; align-items: flex-start; }
      input[type="range"] { width: 100%; }
      .speed-box { width: 120px; }
    }
  </style>
</head>
<body>
  <div id="gameShell">
    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <div id="menu" class="panel">
      <div class="menu-box">
        <h1>NEON ROAD RUSH</h1>
        <div class="subtitle">Retro Highway Survival</div>

        <div class="buttons">
          <button id="startBtn">Start</button>
          <button id="settingsToggle" class="secondary">Einstellungen</button>
        </div>

        <div id="settings" class="settings hidden">
          <div class="setting-row">
            <span>Speed Multiplier</span>
            <span id="speedValue">1.0x</span>
          </div>
          <input id="speedMult" type="range" min="1" max="2.5" step="0.1" value="1.0" />

          <label class="check">
            <span>Turbo-Cheat</span>
            <input id="turboCheat" type="checkbox" />
          </label>

          <label class="check">
            <span>Nachtmodus</span>
            <input id="nightMode" type="checkbox" />
          </label>
        </div>
      </div>
    </div>

    <div id="gameOver" class="panel hidden">
      <div class="game-over-box">
        <h2>Game Over</h2>
        <div class="subtitle">Dein Lauf endete</div>
        <div id="finalScore" class="score-big">0000 m</div>
        <div class="buttons">
          <button id="retryBtn">Nochmal</button>
          <button id="menuBtn" class="alert">Menü</button>
        </div>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-panel">
        <span class="label">Meter</span>
        <span id="distanceValue" class="value">0</span>
      </div>

      <div class="speed-box">
        <span class="label" style="font-size: 0.68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);">
          Speed
        </span>
        <div id="speedDisplay" class="value" style="font-size: 1.2rem; margin-top: 4px;">0 km/h</div>
        <div class="speed-bar">
          <div id="speedFill" class="speed-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const menu = document.getElementById('menu');
    const gameOverPanel = document.getElementById('gameOver');
    const hud = document.getElementById('hud');
    const distanceValue = document.getElementById('distanceValue');
    const speedDisplay = document.getElementById('speedDisplay');
    const speedFill = document.getElementById('speedFill');
    const finalScore = document.getElementById('finalScore');

    const settingsToggle = document.getElementById('settingsToggle');
    const settings = document.getElementById('settings');
    const speedMultInput = document.getElementById('speedMult');
    const speedValueLabel = document.getElementById('speedValue');
    const turboCheatInput = document.getElementById('turboCheat');
    const nightModeInput = document.getElementById('nightMode');

    const state = {
      mode: 'menu',
      startTime: 0,
      lastTime: 0,
      distance: 0,
      score: 0,
      speed: 0,
      targetSpeed: 0,
      obstacles: [],
      particles: [],
      roadScroll: 0,
      spawnTimer: 0,
      flash: 0,
      dayNight: 0.5
    };

    const config = {
      speedMultiplier: 1.0,
      turbo: false,
      night: false
    };

    const player = {
      lane: 1,
      targetLane: 1,
      x: 0,
      y: 0,
      w: 54,
      h: 94,
      color: '#3be2ff',
      tilt: 0
    };

    const keys = {
      left: false,
      right: false,
      up: false,
      down: false
    };

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function rgbToString(r, g, b) {
      return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
    }

    function lerpColor(a, b, t) {
      return [
        lerp(a[0], b[0], t),
        lerp(a[1], b[1], t),
        lerp(a[2], b[2], t)
      ];
    }

    function resetPlayer() {
      player.lane = 1;
      player.targetLane = 1;
      player.x = canvas.width / 2;
      player.y = canvas.height - 120;
      player.tilt = 0;
    }

    function setSettingsLabels() {
      speedValueLabel.textContent = config.speedMultiplier.toFixed(1) + 'x';
    }

    function updateSettingsFromUI() {
      config.speedMultiplier = Number(speedMultInput.value);
      config.turbo = turboCheatInput.checked;
      config.night = nightModeInput.checked;
      setSettingsLabels();
    }

    speedMultInput.addEventListener('input', () => {
      updateSettingsFromUI();
    });

    turboCheatInput.addEventListener('change', () => {
      updateSettingsFromUI();
    });

    nightModeInput.addEventListener('change', () => {
      updateSettingsFromUI();
    });

    settingsToggle.addEventListener('click', () => {
      settings.classList.toggle('hidden');
    });

    function startGame() {
      state.mode = 'playing';
      state.distance = 0;
      state.score = 0;
      state.speed = 0;
      state.targetSpeed = 0;
      state.obstacles = [];
      state.particles = [];
      state.roadScroll = 0;
      state.spawnTimer = 0.8;
      state.flash = 0;

      resetPlayer();
      menu.classList.add('hidden');
      gameOverPanel.classList.add('hidden');
      hud.classList.remove('hidden');
      state.startTime = performance.now();
    }

    function finishGame() {
      state.mode = 'gameover';
      finalScore.textContent = Math.floor(state.distance) + ' m';
      hud.classList.add('hidden');
      gameOverPanel.classList.remove('hidden');
    }

    function backToMenu() {
      state.mode = 'menu';
      menu.classList.remove('hidden');
      gameOverPanel.classList.add('hidden');
      hud.classList.add('hidden');
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const colorPool = ['#ff7d66', '#ffcf5a', '#78e3ff', '#7dff91', '#ff7ae4', '#ffffff'];
      const obstacle = {
        lane,
        x: canvas.width / 2 + (lane - 1) * 90,
        y: -120,
        w: 56,
        h: 90,
        color: colorPool[Math.floor(Math.random() * colorPool.length)],
        wheel: 0
      };
      state.obstacles.push(obstacle);
    }

    function createDust(x, y, n = 10) {
      for (let i = 0; i < n; i++) {
        state.particles.push({
          x,
          y,
          r: randomRange(2, 5),
          vx: randomRange(-20, 20),
          vy: randomRange(-30, 5),
          life: randomRange(0.5, 1.2),
          color: i % 2 === 0 ? 'rgba(255,255,255,0.55)' : 'rgba(100,250,255,0.6)'
        });
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }
    }

    function update(dt) {
      if (state.mode !== 'playing') {
        return;
      }

      const baseSpeed = 190 + (config.speedMultiplier * 120);
      const turboBonus = config.turbo ? 130 : 0;

      if (keys.up) state.targetSpeed = baseSpeed + 110 + turboBonus;
      else if (keys.down) state.targetSpeed = Math.max(110, baseSpeed - 90);
      else state.targetSpeed = baseSpeed + turboBonus;

      state.speed += (state.targetSpeed - state.speed) * 0.08;
      state.roadScroll += state.speed * dt * 1.1;

      state.distance += state.speed * dt * 0.12;
      state.score = Math.floor(state.distance);

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnObstacle();
        state.spawnTimer = clamp(1.2 - state.speed * 0.0018, 0.45, 1.15);
      }

      updateParticles(dt);

      const roadShift = state.speed * dt * 0.9;
      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const o = state.obstacles[i];
        o.y += roadShift + 4;
        o.wheel += dt * 10;

        if (o.y > canvas.height + 120) {
          state.obstacles.splice(i, 1);
          continue;
        }

        const playerBoxX = player.x;
        const playerBoxY = player.y;

        const sameLane = Math.abs(o.lane - player.lane) < 0.3;
        const overlapY = Math.abs(o.y - playerBoxY) < 60;
        const overlapX = Math.abs(playerBoxX - o.x) < 42;

        if (sameLane && overlapY && overlapX) {
          state.flash = 1;
          createDust(player.x, player.y, 22);
          finishGame();
          return;
        }
      }

      if (keys.left) {
        player.targetLane = clamp(player.targetLane - 1, 0, 2);
        keys.left = false;
      }
      if (keys.right) {
        player.targetLane = clamp(player.targetLane + 1, 0, 2);
        keys.right = false;
      }

      const playerLerp = (keys.left || keys.right) ? 0.2 : 0.12;
      player.lane = lerp(player.lane, player.targetLane, playerLerp);

      const laneSpacing = 90;
      player.x = canvas.width / 2 + (player.lane - 1) * laneSpacing;

      if (state.flash > 0) {
        state.flash = Math.max(0, state.flash - dt * 2.2);
      }

      distanceValue.textContent = Math.floor(state.distance) + ' m';
      speedDisplay.textContent = Math.floor(state.speed * 1.4) + ' km/h';
      speedFill.style.width = ((state.speed / 500) * 100) + '%';

      if (state.speed > 500) {
        speedFill.style.background = 'linear-gradient(90deg, #ff9171, #ff5a5a)';
      } else if (state.speed > 350) {
        speedFill.style.background = 'linear-gradient(90deg, #7cff9a, #ffe166, #ff8f6b)';
      } else {
        speedFill.style.background = 'linear-gradient(90deg, #7cff9a, #ffe166, #ff8f6b)';
      }

      // Day/Night cycle
      const time = performance.now() * 0.0001;
      state.dayNight = config.night ? 0.2 : (Math.sin(time) + 1) / 2;
    }

    function drawBackground() {
      const skyTop = lerpColor([12, 19, 32], [117, 175, 255], state.dayNight);
      const skyBottom = lerpColor([24, 36, 56], [214, 233, 255], state.dayNight);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, rgbToString(skyTop[0], skyTop[1], skyTop[2]));
      sky.addColorStop(0.6, rgbToString(skyBottom[0], skyBottom[1], skyBottom[2]));
      
      const skyEnd = lerpColor([18, 24, 36], [32, 58, 86], state.dayNight);
      sky.addColorStop(1, rgbToString(skyEnd[0], skyEnd[1], skyEnd[2]));
      
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun
      const sunX = canvas.width * (0.18 + state.dayNight * 0.65);
      const sunY = 85 + (1 - state.dayNight) * 120;
      const sunRadius = 30 + (1 - state.dayNight) * 10;

      ctx.beginPath();
      ctx.fillStyle = state.dayNight > 0.5 ? 'rgba(255, 224, 130, 0.95)' : 'rgba(200, 220, 255, 0.9)';
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
      ctx.fill();

      // Stars
      if (state.dayNight < 0.38) {
        for (let i = 0; i < 30; i++) {
          const x = (i * 131.7) % canvas.width;
          const y = ((i * 97.5) % 190) + 15;
          if (Math.random() > 0.35) {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }
    }

    function drawRoad() {
      const horizon = 150;
      const roadTopWidth = 220;
      const roadBottomWidth = canvas.width * 0.82;

      const leftTop = canvas.width / 2 - roadTopWidth / 2;
      const rightTop = canvas.width / 2 + roadTopWidth / 2;
      const leftBottom = canvas.width / 2 - roadBottomWidth / 2;
      const rightBottom = canvas.width / 2 + roadBottomWidth / 2;

      // Grass
      ctx.fillStyle = '#285d2b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#2f3d27';
      ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

      // Shoulder
      ctx.fillStyle = '#4c5f43';
      ctx.beginPath();
      ctx.moveTo(leftTop, horizon);
      ctx.lineTo(rightTop, horizon);
      ctx.lineTo(rightBottom, canvas.height);
      ctx.lineTo(leftBottom, canvas.height);
      ctx.closePath();
      ctx.fill();

      // Road asphalt
      ctx.fillStyle = '#30353a';
      ctx.beginPath();
      ctx.moveTo(leftTop, horizon);
      ctx.lineTo(rightTop, horizon);
      ctx.lineTo(rightBottom, canvas.height);
      ctx.lineTo(leftBottom, canvas.height);
      ctx.closePath();
      ctx.fill();

      // Road lane lines
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.setLineDash([32, 24]);
      ctx.lineDashOffset = -state.roadScroll * 0.9;

      for (let i = 1; i < 3; i++) {
        const x1 = lerp(leftTop, leftBottom, i / 3);
        const x2 = lerp(rightTop, rightBottom, i / 3);
        ctx.beginPath();
        ctx.moveTo(x1, horizon);
        ctx.lineTo(x2, canvas.height);
        ctx.stroke();
      }

      ctx.setLineDash([]);

      // Road edges
      ctx.strokeStyle = 'rgba(255, 240, 180, 0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(leftTop, horizon);
      ctx.lineTo(leftBottom, canvas.height);
      ctx.moveTo(rightTop, horizon);
      ctx.lineTo(rightBottom, canvas.height);
      ctx.stroke();

      // Side grass stripes (trees/bushes)
      ctx.fillStyle = 'rgba(119, 228, 118, 0.18)';
      for (let i = 0; i < 18; i++) {
        const bob = (i * 70 + state.roadScroll * 0.9) % (canvas.height + 100);
        const y = bob;
        const width = 32 + (i % 4) * 18;
        ctx.fillRect(0, y + 3, width, 6);
        ctx.fillRect(canvas.width - width, y + 3, width, 6);
      }
    }

    function drawTrees() {
      const horizon = 150;
      const offset = state.roadScroll * 0.8;

      for (let i = 0; i < 18; i++) {
        const t = ((i * 65 + offset) % 980) / 980;
        const y = lerp(horizon + 20, canvas.height + 6, t);
        const drawXLeft = 50 + (1 - t) * 40;
        const drawXRight = canvas.width - 50 - (1 - t) * 40;
        const size = 16 + (1 - t) * 34;

        drawTree(drawXLeft, y, size, i % 2 === 0 ? '#1f7b42' : '#268d5e');
        drawTree(drawXRight, y, size, i % 3 === 0 ? '#2b8f54' : '#1c7d45');
      }
    }

    function drawTree(x, y, size, leafColor) {
      ctx.fillStyle = '#4d2b18';
      ctx.fillRect(x - 3, y - size * 0.4, 6, size * 0.7);

      ctx.beginPath();
      ctx.fillStyle = leafColor;
      ctx.arc(x, y - size * 0.5, size * 0.7, 0, Math.PI * 2);
      ctx.arc(x - size * 0.45, y - size * 0.35, size * 0.55, 0, Math.PI * 2);
      ctx.arc(x + size * 0.45, y - size * 0.35, size * 0.55, 0, Math.PI * 2);
      ctx.arc(x, y - size * 0.82, size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function lightenColor(hex, amount) {
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      const r = clamp(((num >> 16) & 255) + amount, 0, 255);
      const g = clamp(((num >> 8) & 255) + amount, 0, 255);
      const b = clamp((num & 255) + amount, 0, 255);
      return rgbToString(r, g, b);
    }

    function darkenColor(hex, amount) {
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      const r = clamp(((num >> 16) & 255) - amount, 0, 255);
      const g = clamp(((num >> 8) & 255) - amount, 0, 255);
      const b = clamp((num & 255) - amount, 0, 255);
      return rgbToString(r, g, b);
    }

    function drawCar(x, y, w, h, color, isPlayer = false) {
      ctx.save();
      ctx.translate(x, y);

      const bodyShadow = isPlayer ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.25)';
      ctx.fillStyle = bodyShadow;
      ctx.fillRect(-w * 0.5 + 6, h * 0.14, w * 0.98, h * 0.72);

      const body = ctx.createLinearGradient(0, -h * 0.1, 0, h * 0.8);
      body.addColorStop(0, lightenColor(color, 45));
      body.addColorStop(0.35, color);
      body.addColorStop(1, darkenColor(color, 28));

      ctx.fillStyle = body;
      roundedRect(-w / 2, -h / 2, w, h, 12);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(-w * 0.28, -h * 0.3, w * 0.56, h * 0.26);

      ctx.fillStyle = '#d7ecff';
      ctx.fillRect(-w * 0.22, -h * 0.25, w * 0.16, h * 0.17);
      ctx.fillRect(w * 0.06, -h * 0.25, w * 0.16, h * 0.17);

      ctx.fillStyle = '#111827';
      ctx.fillRect(-w * 0.34, -h * 0.45, 12, 18);
      ctx.fillRect(w * 0.22, -h * 0.45, 12, 18);
      ctx.fillRect(-w * 0.34, h * 0.28, 12, 18);
      ctx.fillRect(w * 0.22, h * 0.28, 12, 18);

      if (isPlayer) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-w * 0.28, -h * 0.33, w * 0.56, h * 0.38);
      }

      ctx.restore();
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawObstacles() {
      for (const o of state.obstacles) {
        const x = o.x;
        const y = o.y;
        drawCar(x, y, o.w, o.h, o.color, false);
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;
      drawCar(x, y, player.w, player.h, player.color, true);
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = clamp(p.life, 0, 1);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawHUDGlow() {
      if (state.flash > 0) {
        ctx.fillStyle = `rgba(255, 70, 90, ${state.flash * 0.4})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function draw() {
      drawBackground();
      drawRoad();
      drawTrees();

      drawObstacles();
      drawPlayer();
      drawParticles();

      drawHUDGlow();

      if (state.mode === 'menu') {
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (state.mode === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) {
        e.preventDefault();
      }

      if (key === 'a' || key === 'arrowleft') keys.left = true;
      if (key === 'd' || key === 'arrowright') keys.right = true;
      if (key === 'w' || key === 'arrowup') keys.up = true;
      if (key === 's' || key === 'arrowdown') keys.down = true;

      if (key === 'enter' && state.mode !== 'playing') {
        startGame();
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'a' || key === 'arrowleft') keys.left = false;
      if (key === 'd' || key === 'arrowright') keys.right = false;
      if (key === 'w' || key === 'arrowup') keys.up = false;
      if (key === 's' || key === 'arrowdown') keys.down = false;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('menuBtn').addEventListener('click', backToMenu);

    updateSettingsFromUI();
    resetPlayer();
    requestAnimationFrame(loop);

    function loop(ts) {
      const dt = clamp((ts - (state.lastTime || ts)) / 1000, 0.016, 0.033);
      state.lastTime = ts;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
