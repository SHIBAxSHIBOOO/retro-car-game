<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON ROAD RUSH - 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Arial Black", sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .ui-panel {
      position: absolute;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #0ff;
      padding: 10px 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    #speedometer {
      top: 20px;
      right: 20px;
      min-width: 200px;
    }

    #distanceometer {
      top: 20px;
      left: 20px;
    }

    #menu {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0f0a1f);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 30px;
    }

    #menu.hidden {
      display: none;
    }

    #menu h1 {
      font-size: 4rem;
      text-shadow: 0 0 30px #0ff, 0 0 60px #0f0;
      letter-spacing: 4px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 30px #0ff, 0 0 60px #0f0; }
      50% { text-shadow: 0 0 50px #0ff, 0 0 80px #0f0, 0 0 100px #f0f; }
    }

    .menu-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .menu-btn {
      padding: 15px 40px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #0ff, #0f0);
      border: none;
      color: #000;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      transition: all 0.2s;
    }

    .menu-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 1), 0 0 60px rgba(0, 255, 0, 1);
    }

    .settings-panel {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #0ff;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      gap: 20px;
    }

    .setting-row label {
      color: #0ff;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .setting-row input[type="range"] {
      width: 150px;
      cursor: pointer;
    }

    .setting-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .setting-value {
      color: #0f0;
      font-weight: bold;
      min-width: 60px;
    }

    #gameOver {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      gap: 20px;
    }

    #gameOver.hidden {
      display: none;
    }

    #gameOver h2 {
      font-size: 3rem;
      color: #f0f;
      text-shadow: 0 0 30px #f0f;
      letter-spacing: 3px;
    }

    #finalScore {
      font-size: 2.5rem;
      color: #0f0;
      text-shadow: 0 0 20px #0f0;
    }

    .hud-info {
      position: absolute;
      color: #0ff;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #turbo-indicator {
      bottom: 20px;
      left: 20px;
      color: #f00;
      text-shadow: 0 0 10px #f00;
    }

    .turbo-bar {
      width: 200px;
      height: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #f00;
      margin-top: 5px;
      position: relative;
    }

    .turbo-fill {
      height: 100%;
      background: linear-gradient(90deg, #f00, #ff0);
      width: 0%;
      box-shadow: 0 0 10px #f00;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="menu">
      <h1>⚡ NEON ROAD RUSH ⚡</h1>
      <div class="subtitle" style="color: #0f0; font-size: 20px; letter-spacing: 2px; text-transform: uppercase;">
        PS2 STYLE • 3D RACING • PURE CHAOS
      </div>

      <div class="menu-buttons">
        <button class="menu-btn" id="startBtn">START GAME</button>
        <button class="menu-btn" id="settingsBtn" style="background: linear-gradient(135deg, #f0f, #f00);">SETTINGS</button>
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <div class="setting-row">
          <label>Speed</label>
          <input id="speedMult" type="range" min="0.8" max="2.5" step="0.1" value="1" />
          <span class="setting-value" id="speedVal">1.0x</span>
        </div>

        <div class="setting-row">
          <label>Traffic</label>
          <input id="trafficMult" type="range" min="0.5" max="2.5" step="0.1" value="1" />
          <span class="setting-value" id="trafficVal">1.0x</span>
        </div>

        <div class="setting-row">
          <label>Turbo Mode</label>
          <input id="turboMode" type="checkbox" />
        </div>

        <div class="setting-row">
          <label>Night Mode</label>
          <input id="nightMode" type="checkbox" />
        </div>

        <div class="setting-row">
          <label>No Collide</label>
          <input id="noCollide" type="checkbox" />
        </div>
      </div>
    </div>

    <div id="gameOver" class="hidden">
      <h2>GAME OVER</h2>
      <div id="finalScore">0 METERS</div>
      <div class="menu-buttons">
        <button class="menu-btn" id="retryBtn">TRY AGAIN</button>
        <button class="menu-btn" id="menuBtn">MAIN MENU</button>
      </div>
    </div>

    <div id="speedometer" class="ui-panel">
      <div>Speed: <span id="speedDisplay">0</span> km/h</div>
      <div style="margin-top: 10px; font-size: 12px;">RPM: <span id="rpmDisplay">0</span></div>
    </div>

    <div id="distanceometer" class="ui-panel">
      <div>Distance: <span id="distDisplay">0</span> m</div>
      <div style="margin-top: 10px;">Best: <span id="bestDisplay">0</span> m</div>
    </div>

    <div id="turbo-indicator">
      TURBO
      <div class="turbo-bar">
        <div class="turbo-fill" id="turboFill"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // ==================== SIMPLE 3D ENGINE ====================
    class Vec3 {
      constructor(x = 0, y = 0, z = 0) {
        this.x = x;
        this.y = y;
        this.z = z;
      }

      add(v) {
        return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z);
      }

      sub(v) {
        return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z);
      }

      scale(s) {
        return new Vec3(this.x * s, this.y * s, this.z * s);
      }
    }

    class Cube {
      constructor(x, y, z, width, height, depth, color) {
        this.pos = new Vec3(x, y, z);
        this.w = width;
        this.h = height;
        this.d = depth;
        this.color = color;
        this.rotX = 0;
        this.rotY = 0;
        this.rotZ = 0;
      }

      getVertices() {
        const hw = this.w / 2;
        const hh = this.h / 2;
        const hd = this.d / 2;

        let vertices = [
          new Vec3(-hw, -hh, -hd),
          new Vec3(hw, -hh, -hd),
          new Vec3(hw, hh, -hd),
          new Vec3(-hw, hh, -hd),
          new Vec3(-hw, -hh, hd),
          new Vec3(hw, -hh, hd),
          new Vec3(hw, hh, hd),
          new Vec3(-hw, hh, hd)
        ];

        // Rotation X
        let cosX = Math.cos(this.rotX);
        let sinX = Math.sin(this.rotX);
        vertices = vertices.map(v => {
          let ny = v.y * cosX - v.z * sinX;
          let nz = v.y * sinX + v.z * cosX;
          return new Vec3(v.x, ny, nz);
        });

        // Rotation Y
        let cosY = Math.cos(this.rotY);
        let sinY = Math.sin(this.rotY);
        vertices = vertices.map(v => {
          let nx = v.x * cosY + v.z * sinY;
          let nz = -v.x * sinY + v.z * cosY;
          return new Vec3(nx, v.y, nz);
        });

        // Rotation Z
        let cosZ = Math.cos(this.rotZ);
        let sinZ = Math.sin(this.rotZ);
        vertices = vertices.map(v => {
          let nx = v.x * cosZ - v.y * sinZ;
          let ny = v.x * sinZ + v.y * cosZ;
          return new Vec3(nx, ny, v.z);
        });

        // Translate
        return vertices.map(v => v.add(this.pos));
      }

      project(camera) {
        const vertices = this.getVertices();
        const projected = [];

        for (let v of vertices) {
          const rel = v.sub(camera);
          if (rel.z <= 0.1) continue; // Behind camera

          const scale = camera.z / (rel.z + 300);
          const x = canvas.width / 2 + rel.x * scale;
          const y = canvas.height / 2 - rel.y * scale;
          const z = rel.z;

          projected.push({ x, y, z, original: rel });
        }

        return projected;
      }
    }

    function drawCube3D(cube, camera) {
      const proj = cube.project(camera);
      if (proj.length === 0) return;

      // Draw cube faces
      const edges = [
        [0, 1], [1, 2], [2, 3], [3, 0], // Front
        [4, 5], [5, 6], [6, 7], [7, 4], // Back
        [0, 4], [1, 5], [2, 6], [3, 7]  // Sides
      ];

      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.fillStyle = cube.color;

      // Simple face rendering
      const faces = [
        [0, 1, 2, 3], // Front
        [4, 5, 6, 7], // Back
        [0, 1, 5, 4], // Bottom
        [3, 2, 6, 7], // Top
        [0, 3, 7, 4], // Left
        [1, 2, 6, 5]  // Right
      ];

      for (let face of faces) {
        if (face.every(i => i < proj.length)) {
          ctx.beginPath();
          ctx.moveTo(proj[face[0]].x, proj[face[0]].y);
          for (let i = 1; i < face.length; i++) {
            ctx.lineTo(proj[face[i]].x, proj[face[i]].y);
          }
          ctx.closePath();
          
          // Calculate face brightness based on depth
          const avgZ = face.reduce((sum, i) => sum + proj[i].z, 0) / face.length;
          const brightness = Math.max(0.3, 1 - avgZ / 1000);
          
          ctx.fillStyle = adjustBrightness(cube.color, brightness);
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    function adjustBrightness(color, brightness) {
      const c = parseInt(color.replace('#', ''), 16);
      const r = Math.floor(((c >> 16) & 255) * brightness);
      const g = Math.floor(((c >> 8) & 255) * brightness);
      const b = Math.floor((c & 255) * brightness);
      return `rgb(${r},${g},${b})`;
    }

    // ==================== GAME STATE ====================
    const gameState = {
      mode: 'menu',
      distance: 0,
      speed: 0,
      targetSpeed: 0,
      turbo: 0,
      maxTurbo: 100,
      roadPosition: 0,
      playerLane: 1, // 0, 1, 2
      targetLane: 1,
      crashed: false,
      best: localStorage.getItem('neonRushBest') || 0
    };

    const config = {
      speedMult: 1,
      trafficMult: 1,
      turboMode: false,
      nightMode: false,
      noCollide: false
    };

    const input = {
      left: false,
      right: false,
      up: false,
      down: false,
      space: false
    };

    const roadSegments = [];
    const obstacles = [];
    const camera = new Vec3(0, 30, 0);

    // ==================== ROAD GENERATION ====================
    function generateRoad() {
      roadSegments.length = 0;
      for (let i = -50; i < 150; i++) {
        const z = i * 100;
        const wobble = Math.sin(i * 0.15) * 20;
        
        const leftEdge = new Cube(wobble - 200, -5, z, 20, 10, 100, '#333');
        const rightEdge = new Cube(wobble + 200, -5, z, 20, 10, 100, '#333');
        const road = new Cube(wobble, -5, z, 400, 10, 100, '#2a2a2a');
        
        roadSegments.push({ left: leftEdge, right: rightEdge, road: road, z });
      }
    }

    // ==================== RENDERING ====================
    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      
      if (config.nightMode) {
        gradient.addColorStop(0, '#0a0a2e');
        gradient.addColorStop(0.5, '#16213e');
        gradient.addColorStop(1, '#0f3460');
      } else {
        gradient.addColorStop(0, '#87ceeb');
        gradient.addColorStop(0.5, '#e0c097');
        gradient.addColorStop(1, '#d2691e');
      }
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun/Moon
      ctx.fillStyle = config.nightMode ? '#e0e0e0' : '#ffcc00';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.75, canvas.height * 0.2, 40, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGame() {
      drawBackground();

      // Update camera
      camera.x = gameState.playerLane * 100 - 100;
      camera.z = gameState.roadPosition;
      camera.y = 30;

      // Draw road
      for (let seg of roadSegments) {
        if (Math.abs(seg.z - camera.z) < 1000) {
          drawCube3D(seg.road, camera);
          drawCube3D(seg.left, camera);
          drawCube3D(seg.right, camera);
        }
      }

      // Draw obstacles
      for (let obs of obstacles) {
        drawCube3D(obs.cube, camera);
      }

      // Draw player car
      const playerCar = new Cube(
        gameState.playerLane * 100 - 100,
        10,
        gameState.roadPosition + 200,
        60,
        30,
        80,
        '#0f0'
      );
      drawCube3D(playerCar, camera);

      // Speed lines
      if (gameState.speed > 300) {
        ctx.strokeStyle = `rgba(0, 255, 255, ${(gameState.speed - 300) / 300 * 0.5})`;
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) {
          const offset = (gameState.roadPosition * 2 + i * 100) % canvas.height;
          ctx.beginPath();
          ctx.moveTo(0, offset);
          ctx.lineTo(canvas.width, offset);
          ctx.stroke();
        }
      }

      // Crash flash
      if (gameState.crashed) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    // ==================== GAME LOGIC ====================
    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const colors = ['#ff6b6b', '#ff9ff3', '#54a0ff', '#48dbfb', '#1dd1a1', '#ffa502'];
      const z = gameState.roadPosition + canvas.height + 500;
      
      obstacles.push({
        lane,
        z,
        speed: gameState.speed * (0.6 + Math.random() * 0.3),
        cube: new Cube(lane * 100 - 100, 10, z, 60, 30, 80, colors[Math.floor(Math.random() * colors.length)])
      });
    }

    function updateGame(deltaTime) {
      const dt = deltaTime / 1000;

      const baseSpeed = 150 + config.speedMult * 100;
      
      if (input.up) {
        gameState.targetSpeed = baseSpeed + 200;
        if (config.turboMode && gameState.turbo > 0) {
          gameState.targetSpeed += 150;
          gameState.turbo = Math.max(0, gameState.turbo - deltaTime * 0.05);
        }
      } else if (input.down) {
        gameState.targetSpeed = Math.max(50, baseSpeed - 100);
      } else {
        gameState.targetSpeed = baseSpeed;
      }

      gameState.speed += (gameState.targetSpeed - gameState.speed) * 0.1;
      gameState.roadPosition += gameState.speed * dt;

      if (!input.up && gameState.turbo < gameState.maxTurbo) {
        gameState.turbo += deltaTime * 0.02;
      }

      if (input.left) {
        gameState.targetLane = Math.max(0, gameState.targetLane - 1);
        input.left = false;
      }
      if (input.right) {
        gameState.targetLane = Math.min(2, gameState.targetLane + 1);
        input.right = false;
      }

      gameState.playerLane += (gameState.targetLane - gameState.playerLane) * 0.15;

      if (Math.random() < 0.02 * config.trafficMult) {
        spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z += obs.speed * dt;
        obs.cube.pos.z = obs.z;

        if (obs.z > gameState.roadPosition + 1000) {
          obstacles.splice(i, 1);
          gameState.distance += 10;
          continue;
        }

        if (!config.noCollide) {
          if (Math.abs(obs.z - (gameState.roadPosition + 200)) < 50) {
            if (Math.abs(obs.lane - gameState.playerLane) < 0.5) {
              gameState.crashed = true;
            }
          }
        }
      }

      document.getElementById('distDisplay').textContent = Math.floor(gameState.distance);
      document.getElementById('speedDisplay').textContent = Math.floor(gameState.speed * 1.5);
      document.getElementById('rpmDisplay').textContent = Math.floor((gameState.speed / 600) * 10000);
      document.getElementById('turboFill').style.width = (gameState.turbo / gameState.maxTurbo * 100) + '%';
    }

    // ==================== INPUT ====================
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') input.up = true;
      if (key === 's' || key === 'arrowdown') input.down = true;
      if (key === 'a' || key === 'arrowleft') input.left = true;
      if (key === 'd' || key === 'arrowright') input.right = true;

      if (key === 'enter' && gameState.mode !== 'playing') {
        startGame();
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') input.up = false;
      if (key === 's' || key === 'arrowdown') input.down = false;
      if (key === 'a' || key === 'arrowleft') input.left = false;
      if (key === 'd' || key === 'arrowright') input.right = false;
    });

    // ==================== UI ====================
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('menuBtn').addEventListener('click', () => {
      gameState.mode = 'menu';
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('gameOver').classList.add('hidden');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('speedMult').addEventListener('input', (e) => {
      config.speedMult = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = config.speedMult.toFixed(1) + 'x';
    });

    document.getElementById('trafficMult').addEventListener('input', (e) => {
      config.trafficMult = parseFloat(e.target.value);
      document.getElementById('trafficVal').textContent = config.trafficMult.toFixed(1) + 'x';
    });

    document.getElementById('turboMode').addEventListener('change', (e) => {
      config.turboMode = e.target.checked;
    });

    document.getElementById('nightMode').addEventListener('change', (e) => {
      config.nightMode = e.target.checked;
    });

    document.getElementById('noCollide').addEventListener('change', (e) => {
      config.noCollide = e.target.checked;
    });

    function startGame() {
      gameState.mode = 'playing';
      gameState.distance = 0;
      gameState.speed = 0;
      gameState.targetSpeed = 0;
      gameState.turbo = gameState.maxTurbo * 0.5;
      gameState.roadPosition = 0;
      gameState.playerLane = 1;
      gameState.targetLane = 1;
      gameState.crashed = false;
      obstacles.length = 0;

      document.getElementById('menu').classList.add('hidden');
      document.getElementById('gameOver').classList.add('hidden');
      
      generateRoad();
    }

    function endGame() {
      gameState.mode = 'gameover';
      document.getElementById('finalScore').textContent = Math.floor(gameState.distance) + ' METERS';
      
      if (gameState.distance > gameState.best) {
        gameState.best = gameState.distance;
        localStorage.setItem('neonRushBest', gameState.best);
      }
      
      document.getElementById('bestDisplay').textContent = Math.floor(gameState.best) + ' m';
      document.getElementById('gameOver').classList.remove('hidden');
    }

    // ==================== MAIN LOOP ====================
    generateRoad();
    let lastTime = performance.now();

    function gameLoop(now) {
      const deltaTime = now - lastTime;
      lastTime = now;

      if (gameState.mode === 'playing') {
        updateGame(deltaTime);
        
        if (gameState.crashed) {
          setTimeout(() => {
            endGame();
          }, 500);
          gameState.mode = 'ending';
        }
      }

      drawGame();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
